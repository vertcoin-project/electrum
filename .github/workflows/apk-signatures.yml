# Signs a draft release's APKs with the detached signatures uploaded to it.
#
# The release build (guix.yml) attaches unsigned APKs. The maintainer downloads
# them, signs them offline with contrib/android/apksig.sh sign, and uploads only
# the NAME-release.apk.sig.tar signatures to the draft. This workflow then puts
# each signature on the unsigned APK it was made from, checks that the result
# verifies (a signature of any other APK does not), and uploads the signed APKs.
# Anyone can do the same with their own build: see contrib/android/Readme.md.
name: apk signatures

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v4.8.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: attach the signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*-release-unsigned.apk' --pattern '*-release.apk.sig.tar' --pattern SHA256SUMS
          ls -l
          # every APK is signed, or none: a release must not ship some unsigned
          shopt -s nullglob
          unsigned=(*-release-unsigned.apk)
          [ "${#unsigned[@]}" -gt 0 ] || { echo "no unsigned APKs in $TAG" >&2; exit 1; }
          for apk in "${unsigned[@]}"; do
            signed="${apk%-release-unsigned.apk}-release.apk"
            [ -f "$signed.sig.tar" ] || { echo "no $signed.sig.tar in $TAG" >&2; exit 1; }
            ../contrib/android/apksig.sh attach "$signed.sig.tar" "$apk" "$signed"
          done
          # SHA256SUMS lists the release's files: add the signed APKs and their signatures
          sha256sum -- *-release.apk *-release.apk.sig.tar > signed.sums
          cat signed.sums
          grep -vF -f <(awk '{print " " $2}' signed.sums) SHA256SUMS | cat - signed.sums \
            | LC_ALL=C sort -k2 > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *-release.apk SHA256SUMS
